<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>promo screenshot harness</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #2f3134; }
    iframe { display: block; border: 0; width: 1200px; height: 600px; }
  </style>
</head>
<body>
  <!-- Regenerates screenshot.png (the og:image, and the repo-root
       Screenshot1.png the README shows) — 1200×600 of the Timeline with the
       song PLAYING, so the meters and the playhead are live:

         python3 tools/test-server.py, then
         chromium --headless=new --window-size=1200,600 --timeout=14000 \
           --autoplay-policy=no-user-gesture-required \
           --screenshot=/tmp/screenshot.png \
           http://localhost:8932/test/browser/promo-shot.html
         cp /tmp/screenshot.png microtone-worker/screenshot.png
         cp /tmp/screenshot.png Screenshot1.png

       The window is sized to the shot and the iframe fills it exactly, so the
       capture IS the app. The pending /hang image holds the load event open
       for --timeout, which is how the page gets to play before the frame is
       grabbed (a virtual-time budget would freeze the audio clock instead).

       Two things make the frame reproducible without knowing WHEN the capture
       lands: the master strip is switched off (600 px is too short for its
       scopes, and the original shot predates it), and the song is restarted
       every RESTART_MS, so whenever the shutter falls the playhead is near the
       top of the song — 4THSYM's densest passage — with the meters live.
       ?song= / ?theme= / ?master=1 override the defaults. -->
  <img src="/hang" hidden />
  <script>
    const p = new URLSearchParams(location.search);
    const RESTART_MS = parseInt(p.get("restart") ?? "1400", 10);
    const song = p.get("song") ?? "test/corpus/4THSYM.taud";
    const theme = p.get("theme") ?? "dim";
    const f = document.createElement("iframe");
    f.src = `../../index.html?load=${encodeURIComponent(song)}&theme=${theme}`;
    document.body.appendChild(f);

    const poll = setInterval(() => {
      const win = f.contentWindow;
      if (!win?.__microtone?.store.doc) return;
      clearInterval(poll);
      const doc = win.document;
      if (p.get("master") !== "1") doc.getElementById("tbMaster").click();
      doc.getElementById("playSong").click();
      setInterval(() => doc.getElementById("playSong").click(), RESTART_MS);
    }, 100);
  </script>
</body>
</html>
