<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>welcome screen — visual</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #2f3134; }
    iframe { display: block; border: 0; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <!-- Item 104: the welcome screen with the Recent panel actually populated —
       a fresh browser profile has no projects, which is exactly the state you
       do NOT want to be looking at while designing it. This seeds a handful
       into OPFS and then mounts the app filling the window:

         python3 tools/test-server.py, then
         chromium --headless=new --window-size=1400,900 --timeout=9000 \
           --screenshot=/tmp/welcome.png \
           http://localhost:8932/test/browser/welcome-visual.html

       ?theme=dark|dim|light and ?seed=0 (leave OPFS alone) override. The
       pending /hang image holds the load event open for --timeout, which is
       how the seeding and the panels' own fetches get to finish before the
       frame is grabbed.

       Every row reads as just-saved: a seeded file's OPFS mtime is the moment
       this page wrote it, and that is the newer of the two keys the panel
       sorts on. Order and layout are what this is for. -->
  <img src="/hang" hidden alt="" />
  <script type="module">
    import * as opfs from "../../src/storage/opfs.js";
    const p = new URLSearchParams(location.search);
    // Written oldest-first, so the panel lists them in this order reversed.
    const SEED = [
      "untitled.taud", "spatial-demo.taud", "bohlen-pierce-sketch.taud",
      "31-tet-etude.taud", "gamelan-study.taud",
    ];
    if (p.get("seed") !== "0") {
      const bytes = new Uint8Array(await (await fetch("../corpus/WHEN.taud")).arrayBuffer());
      for (const name of SEED) await opfs.write(name, bytes);
    }
    const f = document.createElement("iframe");
    f.src = `../../index.html?theme=${p.get("theme") ?? "dim"}`;
    document.body.appendChild(f);
  </script>
</body>
</html>
