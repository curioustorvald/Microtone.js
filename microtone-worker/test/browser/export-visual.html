<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Audio export dialog visual harness (screenshot / layout tuning)</title>
</head>
<body>
  <!-- Leaves the Export audio dialog (#998.4) open for a screenshot, the same
       harness shape as panner-visual:
         chromium --headless=new --window-size=1400,1000 --screenshot=/tmp/export.png \
           --timeout=15000 "http://localhost:8932/test/browser/export-visual.html?theme=dark"
       ?theme=light for the light theme, ?model=0 for a stereo song (no downmix
       row), ?format=<id> to preselect a card. -->
  <img src="/hang" hidden>
  <iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1360px;height:940px;border:0"></iframe>
  <script type="module">
    (async () => {
      const frame = document.getElementById("app");
      const win = await new Promise((resolve) => {
        const poll = setInterval(() => {
          const w = frame.contentWindow;
          if (w && w.__microtone?.store.doc) { clearInterval(poll); resolve(w); }
        }, 100);
      });
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const params = new URLSearchParams(location.search);
      const theme = params.get("theme");
      if (theme) (await win.eval('import("/src/ui/theme.js")')).applyTheme(theme);

      const { store } = win.__microtone;
      for (let i = 0; i < 100 && !store.song; i++) await sleep(50);
      const { setSongScalarOp } = await win.eval('import("/src/doc/ops.js")');
      store.undo.apply(setSongScalarOp(store.songIndex, "surroundModel",
        parseInt(params.get("model") ?? "2", 10)));
      await sleep(60);

      const doc = win.document;
      doc.querySelector('[data-view="files"]').click();
      await sleep(150);
      const btns = [...doc.querySelectorAll(".files-bar button")];
      btns.find((b) => /audio|wav/i.test(b.textContent)).click();
      let dlg = null;
      for (let i = 0; i < 100 && !dlg; i++) { dlg = doc.querySelector("dialog.export-audio"); await sleep(30); }
      if (params.get("format")) dlg.__exportAudio.pick(params.get("format"));
    })();
  </script>
</body>
</html>
