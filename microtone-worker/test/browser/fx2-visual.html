<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Second effect column visual harness (screenshot / layout tuning)</title>
</head>
<body>
  <!-- A version-3 project with real effects in both slots, the second effect
       column EXPOSED on some channels and hidden on others, so the mixed-width
       strips, the separator rule between the two effect groups and the amber
       E2 "there is something hidden here" hint can all be looked at at once:
         chromium --headless=new --window-size=1400,1000 --screenshot=/tmp/fx2.png \
           --timeout=20000 "http://localhost:8932/test/browser/fx2-visual.html?theme=dark"
       ?theme=light for the light theme; ?view=pattern for the Patterns tab
       (pane #1 showing its column, the rest hiding theirs); ?all=1 exposes
       every channel. -->
  <img src="/hang" hidden>
  <iframe id="app" src="../../index.html" style="width:1360px;height:940px;border:0"></iframe>
  <script type="module">
    (async () => {
      const q = new URLSearchParams(location.search);
      const frame = document.getElementById("app");
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const win = await new Promise((resolve) => {
        const poll = setInterval(() => {
          if (frame.contentWindow?.__microtone) { clearInterval(poll); resolve(frame.contentWindow); }
        }, 50);
      });
      const M = win.__microtone;
      const doc = win.document;
      const { store } = M;
      if (q.get("theme")) win.__microtoneSetTheme?.(q.get("theme"));

      // A spatial project — format 3 is what has a second effect at all.
      doc.getElementById("newBtn").click();
      let np = null;
      for (let i = 0; i < 100 && !np; i++) { np = doc.querySelector("dialog.np-modal"); await sleep(30); }
      np.querySelectorAll("[data-pan]")[2].click();
      await sleep(30);
      np.querySelector(".np-ok").click();
      for (let i = 0; i < 100 && !store.doc?.wideCells; i++) await sleep(30);
      await sleep(200);

      // Something to look at: notes, a first effect on every channel, and a
      // second one on the first four — so channels 5+ are the "empty second
      // slot" case and channels 1-4 the interesting one.
      const song = store.song;
      for (let ch = 0; ch < 6; ch++) {
        const pat = song.cues[0][ch] & 0x7fff;
        if (pat === 0x7fff) continue;
        store.doc.ensurePattern(store.songIndex, pat);
        const rows = store.doc.patternAt(store.songIndex, pat);
        for (let r = 0; r < 64; r += 2) {
          const c = rows[r];
          c.note = 0x5000 + (r % 12) * 0x155;
          c.instrment = 1;
          c.volume = 0xc0; c.volumeEff = 0;
          c.azimuth = 0x80 + ch * 16; c.panEff = 0; c.elevation = r % 3 === 0 ? 0x20 : 0;
          c.effect = 0x0d; c.effectArg = 0x0102;           // D
          if (ch < 4) { c.effect2 = 0x16; c.effectArg2 = 0x8000 + r; } // M
        }
      }
      store.sync?.flushPatterns?.();
      store.emit("edit");

      // Channels 1 and 3 show the column; 2 and 4 hide it while HOLDING second
      // effects (the amber E2 hint), 5+ hide an empty one (no hint).
      if (q.get("all") === "1") store.setAllFx2(true);
      else { store.toggleFx2Chan(0); store.toggleFx2Chan(2); }

      if (q.get("view") === "pattern") {
        doc.querySelector('[data-view="pattern"]').click();
        await sleep(250);
        if (q.get("all") !== "1") { store.fx2Panes[0] = true; store.emit("fx2"); }
      } else {
        doc.querySelector('[data-view="timeline"]').click();
        await sleep(150);
        store.cursor = { row: 2, ch: 0, sub: 6, nib: 0 }; // caret on the 2nd opcode
        store.record = true;
        store.emit("cursor");
      }
      await sleep(400);
    })();
  </script>
</body>
</html>
