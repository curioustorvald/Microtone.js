<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>format-upgrade modal visual harness</title></head>
<body>
  <!-- Leaves the format-upgrade dialog open for a screenshot:
         chromium --headless=new --window-size=1400,1000 --screenshot=/tmp/upg.png \
           --timeout=15000 "http://localhost:8932/test/browser/upgrade-visual.html?theme=dark"
       ?theme=light for the light theme. -->
  <img src="/hang" hidden>
  <iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1360px;height:940px;border:0"></iframe>
  <script type="module">
    (async () => {
      const frame = document.getElementById("app");
      const win = await new Promise((resolve) => {
        const poll = setInterval(() => {
          const w = frame.contentWindow;
          if (w && w.__microtone?.store.doc) { clearInterval(poll); resolve(w); }
        }, 100);
      });
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const params = new URLSearchParams(location.search);
      const theme = params.get("theme");
      if (theme) (await win.eval('import("/src/ui/theme.js")')).applyTheme(theme);
      const { store, projectView } = win.__microtone;
      for (let i = 0; i < 100 && !store.song; i++) await sleep(50);
      store.fileName = "my-long-project-name.taud";
      win.document.querySelector('[data-view="project"]').click();
      await sleep(150);
      projectView.setSurroundModel(2);
    })();
  </script>
</body>
</html>
