<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>instrument toolbox + Meta chooser — visual</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#2f3134}iframe{display:block;border:0;width:100vw;height:100vh}</style></head>
<body>
  <!-- Item 167: the two-row instrument toolbox, and the "Meta…" kind chooser
       held open for a grab. `?modal=0` leaves the chooser shut so the toolbox
       itself is what gets photographed.
       python3 tools/test-server.py, then
       chromium --headless=new --window-size=1200,760 --timeout=9000 \
         --screenshot=/tmp/instkind.png \
         http://localhost:8932/test/browser/instkind-visual.html -->
  <img src="/hang" hidden alt="" />
  <script type="module">
    const p = new URLSearchParams(location.search);
    const f = document.createElement("iframe");
    f.src = `../../index.html?theme=${p.get("theme") ?? "dim"}&load=test/corpus/WHEN.taud`;
    document.body.appendChild(f);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    await new Promise((r) => { const i = setInterval(() => {
      if (f.contentWindow?.__microtone?.store?.doc) { clearInterval(i); r(); } }, 100); });
    await sleep(400);
    const d = f.contentDocument;
    d.querySelector('#tabs button[data-view="instruments"]').click();
    await sleep(300);
    if (p.get("modal") !== "0") {
      [...d.querySelectorAll(".side-toolbar-inst button")].at(-1).click();
    }
  </script>
</body>
</html>
