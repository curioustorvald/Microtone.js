<!doctype html><meta charset="utf-8"><title>palette check</title>
<pre id="out">running…</pre>
<img src="/hang" hidden>
<iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1200px;height:700px"></iframe>
<script type="module">
const out = document.getElementById("out");
const log = (s) => { out.textContent += "\n" + s; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
(async () => {
  const app = document.getElementById("app");
  await new Promise((r) => app.addEventListener("load", r));
  const win = app.contentWindow;
  const errs = [];
  win.addEventListener("error", (e) => errs.push(e.message));
  for (let i = 0; i < 200 && !win.__microtone?.store?.song; i++) await sleep(50);
  const M = win.__microtone;
  const edit = await import("../../src/ui/edit.js");
  M.store.record = true;
  for (const [sub, nib] of [[2,0],[2,1],[3,0],[3,2]]) {
    M.store.cursor = { row: 0, ch: 0, sub, nib };
    M.store.emit("cursor");
    await sleep(80);
    const pal = win.document.querySelector("#cmdPalette");
    log(`sub ${sub}.${nib}: ` + (pal ? pal.textContent.replace(/\s+/g," ").slice(0, 220) : "NO PALETTE ELEMENT"));
  }
  log("errors: " + (errs.length ? errs.join(" | ") : "none"));
})();
</script>
