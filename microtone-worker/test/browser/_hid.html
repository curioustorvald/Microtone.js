<!doctype html><meta charset="utf-8"><title>hidden vs author display</title>
<style>.f { display: flex; } .g { display: flex; } .g[hidden] { display: none; }</style>
<div class="f" hidden id="a">A</div><div class="g" hidden id="b">B</div>
<pre id="out"></pre>
<script>
const d = (id) => getComputedStyle(document.getElementById(id)).display;
document.getElementById("out").textContent =
  "author display:flex + [hidden] -> " + d("a") + "\n" +
  "with an explicit [hidden] rule  -> " + d("b");
</script>
