<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Timeline context menu visual harness (screenshot / layout tuning)</title>
</head>
<body>
  <!-- Leaves the Timeline's right-click menu open over the grid, a layout
       harness like panner-visual:
         chromium --headless=new --window-size=1400,1000 --screenshot=/tmp/ctx.png \
           --timeout=15000 "http://localhost:8932/test/browser/ctxmenu-visual.html?theme=dark"
       ?theme=light for the light theme, ?where=header to open it on a channel
       header (the two channel inserts over the mute row), ?where=full for the
       widest case (a block selected and something on the clipboard); the
       default is an empty cue slot (Channel left/right + New pattern).
       ?where=trough opens the ROW menu in the numbered gutter (item 136), with
       a four-row band selected so the labels have a count to quote.
       ?col=note|inst|vol|pan|fx picks which column the pointer lands on, i.e.
       which SECOND row is drawn over the grid; ?muted=1 mutes a channel first,
       which is what adds "Unmute all" to a header's mute row. -->
  <img src="/hang" hidden>
  <iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1360px;height:940px;border:0"></iframe>
  <script type="module">
    (async () => {
      const frame = document.getElementById("app");
      const win = await new Promise((resolve) => {
        const poll = setInterval(() => {
          const w = frame.contentWindow;
          if (w && w.__microtone?.store.doc) { clearInterval(poll); resolve(w); }
        }, 100);
      });
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const params = new URLSearchParams(location.search);
      const theme = params.get("theme");
      if (theme) (await win.eval('import("/src/ui/theme.js")')).applyTheme(theme);

      const { store, timeline } = win.__microtone;
      for (let i = 0; i < 100 && !store.song; i++) await sleep(50);
      // ?surround=1|2 declares a panning model, which is what puts the Panner
      // on the panning column's second row.
      const model = parseInt(params.get("surround") ?? "0", 10);
      if (model) {
        const { setSongScalarOp } = await win.eval('import("/src/doc/ops.js")');
        store.undo.apply(setSongScalarOp(store.songIndex, "surroundModel", model));
        await sleep(80);
      }
      const header = params.get("where") === "header";
      const full = params.get("where") === "full";
      const trough = params.get("where") === "trough";
      const ch = 1;
      if (params.get("muted")) { store.toggleMute(ch === 0 ? 1 : 0); await sleep(60); }
      if (full) {
        // Selection + a filled clipboard: the widest the menu ever gets
        // (Copy, Cut, Paste, Channel left, Channel right).
        const { timeline: tl } = win.__microtone;
        // The selection's COLUMN BAND is what picks the second row, so keep it
        // to the column ?col names — otherwise a whole-cell selection always
        // shows all four tools whatever the pointer is on.
        const SUB = { note: 0, inst: 1, vol: 2, pan: 3, fx: 5 };
        const sub = SUB[params.get("col")];
        tl.sel = sub === undefined
          ? { aRow: 2, aCh: 1, aSub: 0, row: 5, ch: 2, sub: 5 }
          : { aRow: 2, aCh: 1, aSub: sub, row: 5, ch: 1, sub };
        tl.copySelection();
      } else if (trough) {
        timeline.selectRowBand(4, 7); // a band, so the row labels quote a count
        timeline.invalidate();
      } else if (!header) {
        // Blank one channel of cue 0 so the menu picks up its "New pattern" cell.
        const { setCuesOp } = await win.eval('import("/src/doc/ops.js")');
        store.undo.apply(setCuesOp(store.songIndex, [{ cue: 0, ch,
          value: (store.song.cues[0][ch] & 0x8000) | 0x7fff }]));
      }
      await sleep(120);

      const canvas = win.document.getElementById("timeline");
      const r = canvas.getBoundingClientRect();
      const colW = timeline.colWFor(0);
      // Character offsets into a narrow cell (edit.js COL_CHAR_RANGE).
      const COL_X = { note: 1, inst: 6, vol: 9, pan: 13, fx: 17 };
      const col = COL_X[params.get("col")];
      const x = trough ? r.left + 20
        : col === undefined
          ? r.left + 76 + ch * colW + colW / 2
          : r.left + 76 + ch * colW + 2 + col * 7.9 + 1;
      const y = r.top + (header ? 10 : timeline.headerH() + 6 * 16);
      canvas.dispatchEvent(new win.MouseEvent("contextmenu", {
        clientX: x, clientY: y, bubbles: true, cancelable: true, button: 2,
      }));
    })();
  </script>
</body>
</html>
